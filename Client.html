  renderDeckInspector();
}

function closeDeckInspector() {
  deckInspectorOpen = false;

  const overlay =
    document.getElementById('deckInspectorOverlay');

  if (overlay) {
    overlay.classList.add('hidden');
  }
}

function setDeckInspectorFilter(filter) {
  deckInspectorFilter = filter || 'all';

  document
    .querySelectorAll('[data-deck-filter]')
    .forEach(function(button) {
      button.classList.toggle(
        'selected',
        button.getAttribute('data-deck-filter') === deckInspectorFilter
      );
    });

  renderDeckInspector();
}

function renderDeckInspector() {
  const inspector =
    latestGameState &&
    latestGameState.player
      ? latestGameState.player.deckInspector
      : null;

  if (!inspector) return;

  const summary = inspector.summary || {};
  const metrics = document.getElementById('deckInspectorMetrics');

  if (metrics) {
    metrics.innerHTML =
      createDeckMetricHtml_('總牌數', summary.totalCards || 0) +
      createDeckMetricHtml_('行動卡', summary.actionCards || 0) +
      createDeckMetricHtml_('寶物', summary.treasureCards || 0) +
      createDeckMetricHtml_(
        '勝利／詛咒',
        Number(summary.victoryCards || 0) +
        Number(summary.curseCards || 0)
      );
  }

  const input = document.getElementById('deckInspectorSearch');
  const keyword = String(input ? input.value : '')
    .trim()
    .toLowerCase();

  const cards = (inspector.cards || [])
    .filter(function(card) {
      if (
        deckInspectorFilter !== 'all' &&
        card.type !== deckInspectorFilter
      ) {
        return false;
      }

      if (!keyword) return true;

      return (
        String(card.name || '').toLowerCase().indexOf(keyword) !== -1 ||
        String(card.description || '').toLowerCase().indexOf(keyword) !== -1
      );
    });

  const list = document.getElementById('deckInspectorList');
  if (!list) return;

  if (!cards.length) {
    list.innerHTML =
      '<div class="deck-inspector-empty">沒有符合條件的卡片</div>';
    return;
  }

  list.innerHTML =
    cards.map(createDeckInspectorCardHtml_).join('');
}

function createDeckMetricHtml_(label, value) {
  return (
    '<div class="deck-metric"><small>' +
    escapeHtml(label) +
    '</small><strong>' +
    Number(value || 0) +
    '</strong></div>'
  );
}

function createDeckInspectorCardHtml_(card) {
  const locations = [];

  if (Number(card.hand || 0) > 0) {
    locations.push('手牌 ' + card.hand);
  }
  if (Number(card.deck || 0) > 0) {
    locations.push('牌庫 ' + card.deck);
  }
  if (Number(card.discard || 0) > 0) {
    locations.push('棄牌堆 ' + card.discard);
  }
  if (Number(card.play || 0) > 0) {
    locations.push('已打出 ' + card.play);
  }

  return (
    '<div class="deck-inspector-card ' +
    escapeHtml(card.cssClass || card.type) +
    '"><div class="deck-inspector-card-main">' +
    '<div class="deck-inspector-card-name">' +
    escapeHtml(card.name) +
    '<span>×' + Number(card.total || 0) + '</span></div>' +
    '<div class="deck-inspector-card-description">' +
    escapeHtml(card.description || '') +
    '</div></div>' +
    '<div class="deck-inspector-card-meta">' +
    '<span class="deck-cost">費用 ' +
    Number(card.cost || 0) +
    '</span><span>' +
    escapeHtml(locations.join('・')) +
    '</span></div></div>'
  );
}


function renderServerAdvanceStatus(state) {
  const element =
    document.getElementById(
      'serverAdvanceStatus'
    );

  if (!element) return;

  const paused =
    Boolean(
      state.serverAdvancePaused
    );

  element.classList.toggle(
    'hidden',
    !paused
  );

  if (paused) {
    element.textContent =
      '⏸ 無真人在線，遊戲已自動暫停；重新開啟頁面後會繼續。';
  }
}

function renderTurnTimer(state) {
  const timer =
    state.timer || {};

  const panel =
    document.getElementById(
      'turnTimerPanel'
    );

  if (!panel) return;

  clearInterval(timerIntervalId);

  if (!timer.enabled) {
    panel.classList.add('hidden');
    return;
  }

  panel.classList.remove('hidden');
  roomTimerPaused =
    Boolean(timer.paused);
  timerTimeoutRequested = false;
  lastTimerSecond = null;

  const owner =
    document.getElementById(
      'turnTimerOwner'
    );

  if (owner) {
    if (timer.paused) {
      owner.textContent =
        '計時已暫停';
    } else if (
      timer.isSimultaneousBuy
    ) {
      if (
        timer.isViewerOwner &&
        timer.aiControlled
      ) {
        owner.textContent =
          timer.manualAiControl
            ? 'AI 持續接管中，按「恢復真人控制」才會停止'
            : 'AI 正在替你購買';
      } else if (
        timer.isViewerOwner
      ) {
        owner.textContent =
          '你正在購買';
      } else if (
        timer.ownerName
      ) {
        owner.textContent =
          timer.ownerName +
          ' 尚未完成購買';
      } else {
        owner.textContent =
          '等待所有玩家完成購買';
      }
    } else {
      owner.textContent =
        timer.isAiThinking
          ? (
              timer.manualAiControl
                ? (
                    timer.ownerName
                      ? timer.ownerName +
                        ' 由 AI 持續接管中'
                      : 'AI 持續接管中'
                  )
                : (
                    timer.ownerName
                      ? timer.ownerName +
                        ' 由 AI 操作中'
                      : 'AI 操作中'
                  )
            )
          : (
              timer.ownerName
                ? timer.ownerName + ' 思考中'
                : '等待玩家操作'
            );
    }
  }

  renderPendingBuyerTimers_(timer);

  const reclaim =
    document.getElementById(
      'reclaimControlButton'
    );

  const enableAi =
    document.getElementById(
      'enableAiControlButton'
    );

  const modeSelect =
    document.getElementById(
      'aiControlModeSelect'
    );

  if (reclaim) {
    reclaim.classList.toggle(
      'hidden',
      !(
        timer.isViewerOwner &&
        timer.aiControlled
      )
    );
  }

  if (enableAi) {
    enableAi.classList.toggle(
      'hidden',
      Boolean(
        timer.isViewerOwner &&
        timer.aiControlled
      ) ||
      state.gameOver
    );
  }

  if (modeSelect) {
    modeSelect.classList.toggle(
      'hidden',
      Boolean(
        timer.isViewerOwner &&
        timer.aiControlled
      ) ||
      state.gameOver
    );
  }

  const pause =
    document.getElementById(
      'pauseTimerButton'
    );

  if (pause) {
    pause.classList.toggle(
      'hidden',
      state.playerRole !== 'host'
    );

    pause.textContent =
      timer.paused
        ? '恢復計時'
        : '暫停計時';
  }

  updateTurnTimerDisplay_(timer);

  timerIntervalId =
    setInterval(function() {
      updateTurnTimerDisplay_(timer);
    }, 250);
}


function renderPendingBuyerTimers_(timer) {
  const container =
    document.getElementById(
      'pendingBuyerTimerList'
    );

  if (!container) return;

  if (
    !timer.isSimultaneousBuy
  ) {
    container.classList.add('hidden');
    container.innerHTML = '';
    return;
  }

  const pending =
    Array.isArray(timer.pendingBuyers)
      ? timer.pendingBuyers
      : [];

  container.classList.remove('hidden');

  if (!pending.length) {
    container.innerHTML =
      '<span class="pending-buyer-done">' +
      '✓ 所有玩家已完成購買' +
      '</span>';
    return;
  }

  container.innerHTML =
    '<span class="pending-buyer-label">' +
    '尚未完成購買：</span>' +
    pending
      .map(function(player) {
        return (
          '<span class="pending-buyer-chip' +
          (
            player.id === timer.ownerId
              ? ' current'
              : ''
          ) +
          '">' +
          escapeHtml(player.name) +
          (
            player.aiControlled
              ? '（AI 接管）'
              : ''
          ) +
          '</span>'
        );
      })
      .join('');
}

function updateTurnTimerDisplay_(timer) {
  const text =
    document.getElementById(
      'turnTimerText'
    );

  const progress =
    document.getElementById(
      'turnTimerProgress'
    );

  const panel =
    document.getElementById(
      'turnTimerPanel'
    );

  if (!text || !progress || !panel) {
    return;
  }

  if (timer.isAiThinking) {
    text.textContent = 'AI';
    progress.style.width = '100%';
    panel.classList.remove(
      'timer-warning',
      'timer-danger'
    );
    return;
  }

  const total =
    Math.max(
      1,
      Number(timer.thinkTimeSeconds || 1)
    );

  let remaining = total;

  if (timer.paused) {
    text.textContent = '暫停';
    progress.style.width = '100%';
    panel.classList.remove(
      'timer-warning',
      'timer-danger'
    );
    return;
  }

  if (timer.deadlineAt) {
    remaining =
      Math.max(
        0,
        Math.ceil(
          (
            new Date(timer.deadlineAt)
              .getTime() -
            Date.now()
          ) / 1000
        )
      );
  }

  const minutes =
    Math.floor(remaining / 60);

  const seconds =
    remaining % 60;

  text.textContent =
    String(minutes).padStart(2, '0') +
    ':' +
    String(seconds).padStart(2, '0');

  progress.style.width =
    Math.max(
      0,
      Math.min(
        100,
        remaining / total * 100
      )
    ) + '%';

  panel.classList.toggle(
    'timer-warning',
    remaining <= 10 &&
    remaining > 5
  );

  panel.classList.toggle(
    'timer-danger',
    remaining <= 5
  );

  if (
    timer.countdownSound &&
    timer.isViewerTimer &&
    remaining <= 5 &&
    remaining > 0 &&
    remaining !== lastTimerSecond
  ) {
    playTimerBeep_(
      remaining === 1
        ? 880
        : 620
    );
  }

  lastTimerSecond = remaining;

  /*
   * V18.3 超時由每次伺服器同步統一處理。
   * 即使目前玩家已關閉網頁，
   * 其他在線玩家也能推動 AI 接管。
   */
  if (
    remaining <= 0 &&
    !timerTimeoutRequested
  ) {
    timerTimeoutRequested = true;

    setTimeout(function() {
      timerTimeoutRequested = false;
      syncClientState(true);
    }, 250);
  }
}

function playTimerBeep_(frequency) {
  try {
    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if (!AudioContextClass) return;

    const context =
      new AudioContextClass();

    const oscillator =
      context.createOscillator();

    const gain =
      context.createGain();

    oscillator.frequency.value =
      frequency || 620;

    gain.gain.value = 0.04;

    oscillator.connect(gain);
    gain.connect(context.destination);
    oscillator.start();

    setTimeout(function() {
      oscillator.stop();
      context.close();
    }, 90);
  } catch (error) {
    console.warn(
      '計時提示音無法播放',
      error
    );
  }
}

function requestRoomTimeoutClient() {
  google.script.run
    .withSuccessHandler(function() {
      timerTimeoutRequested = false;
      syncClientState(true);
    })
    .withFailureHandler(function(error) {
      timerTimeoutRequested = false;
      console.error(
        '處理超時失敗',
        error
      );

      setTimeout(function() {
        syncClientState(true);
      }, 800);
    })
    .processRoomTimeout(
      currentRoomNumber,
      playerId
    );
}


function enableAiControlClient() {
  const modeSelect =
    document.getElementById(
      'aiControlModeSelect'
    );

  const mode =
    modeSelect
      ? modeSelect.value
      : 'balanced';

  runActionWithRetry_(
    function(success, failure) {
      google.script.run
        .withSuccessHandler(success)
        .withFailureHandler(failure)
        .enableAiControl(
          currentRoomNumber,
          playerId,
          mode
        );
    },
    function(result) {
      showMessage(result.message);

      if (
        typeof firebaseBridgePublishEvent ===
          'function'
      ) {
        firebaseBridgePublishEvent(
          'ai-control-changed',
          {
            playerId:playerId,
            manual:true,
            enabled:true
          }
        );
      }

      fastSyncClientState(function(state) {
        publishFirebasePublicState_(
          state,
          'manual-ai-control'
        );
      });
    }
  );
}

function reclaimControlClient() {
  runActionWithRetry_(
    function(success, failure) {
      google.script.run
        .withSuccessHandler(success)
        .withFailureHandler(failure)
        .reclaimPlayerControl(
          currentRoomNumber,
          playerId
        );
    },
    function(result) {
      showMessage(result.message);

      if (
        typeof firebaseBridgePublishEvent ===
          'function'
      ) {
        firebaseBridgePublishEvent(
          'ai-control-changed',
          {
            playerId:playerId,
            manual:false,
            enabled:false
          }
        );
      }

      fastSyncClientState(function(state) {
        publishFirebasePublicState_(
          state,
          'reclaim-human-control'
        );
      });
    }
  );
}

function toggleTimerPauseClient() {
  runActionWithRetry_(
    function(success, failure) {
      google.script.run
        .withSuccessHandler(success)
        .withFailureHandler(failure)
        .setRoomTimerPaused(
          currentRoomNumber,
          playerId,
          !roomTimerPaused
        );
    },
    function(result) {
      showMessage(result.message);
      syncClientState(true);
    }
  );
}

function showGame() {
  document
    .getElementById('homeView')
    .classList.add('hidden');

  document
    .getElementById('lobbyView')
    .classList.add('hidden');

  document
    .getElementById('gameView')
    .classList.remove('hidden');
}

function setLoading(isLoading) {
  const element =
    document.getElementById('loading');

  clearTimeout(loadingSafetyTimer);
  element.classList.toggle(
    'hidden',
    !isLoading
  );

  if (isLoading) {
    loadingSafetyTimer =
      setTimeout(function() {
        actionInProgress = false;
        currentActionTask = null;
        element.classList.add('hidden');
        startPolling();
        setSyncStatus('連線異常', 'offline');
        showMessage(
          '操作逾時，請再試一次。',
          true
        );
        processNextAction_();
      }, 12000);
  }
}


function repairStaleInteractionDomLock_() {
  if (interactionLockState.locked) {
    return;
  }

  const area =
    document.getElementById(
      'specialChoiceArea'
    );

  if (
    area &&
    area.classList.contains(
      'interaction-pending'
    )
  ) {
    clearSpecialChoicePending_();

    addInteractionEvent_(
      'REPAIR',
      '移除殘留 interaction-pending'
    );
  }
}

setInterval(
  repairStaleInteractionDomLock_,
  500
);

function showMessage(text, isError) {
  const element =
    document.getElementById('message');

  element.textContent = text;
  element.classList.toggle(
    'error',
    Boolean(isError)
  );
  element.classList.add('show');

  clearTimeout(messageTimer);

  messageTimer =
    setTimeout(function() {
      element.classList.remove('show');
    }, 3000);
}


function getClientCardTypes_(card) {
  if (!card) return [];

  if (
    Array.isArray(card.types) &&
    card.types.length
  ) {
    return card.types.map(
      function(type) {
        return String(type || '')
          .trim()
          .toLowerCase();
      }
    );
  }

  return card.type
    ? [
        String(card.type)
          .trim()
          .toLowerCase()
      ]
    : [];
}

function clientHasCardType_(
  card,
  type
) {
  return (
    getClientCardTypes_(card)
      .indexOf(
        String(type || '')
          .trim()
          .toLowerCase()
      ) !== -1
  );
}

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}
document.addEventListener(
  'keydown',
  function(event) {
    if (
      event.key === 'Escape' &&
      deckInspectorOpen
    ) {
      closeDeckInspector();
    }
  }
);

</script>
