<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
  color:#f7f2df;
  background:radial-gradient(circle at top,#33544f 0%,#162e2d 45%,#091817 100%)
}
button,input{font:inherit}
button{cursor:pointer}
.app{width:min(100%,1220px);margin:0 auto;padding:20px 16px 40px}
.title-area{text-align:center;padding:16px 10px 26px}
.title-area h1{margin:0;color:#f2d487;font-size:clamp(32px,7vw,52px);letter-spacing:5px}
.title-area p{color:#c7d7d2}
.panel{padding:22px;border:1px solid rgba(239,211,132,.4);border-radius:20px;background:rgba(8,27,25,.88)}
.hidden{display:none!important}
.section-title{text-align:center;color:#f2d487}
.field{margin-bottom:16px}
.field label{display:block;margin-bottom:8px;font-weight:800}
.field input{width:100%;height:50px;padding:0 14px;border:1px solid #55716d;border-radius:12px;color:#fff;background:#102e2b}
.room-input{text-align:center;font-size:27px;font-weight:900;letter-spacing:12px}
.button-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{min-height:48px;border:0;border-radius:12px;padding:10px 15px;font-weight:900}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{color:#302307;background:linear-gradient(180deg,#f5d982,#c99b32)}
.btn-secondary{color:#fff;background:#315651}
.btn-danger{color:#fff;background:#8b3d3d}
.full-width{width:100%}
.top-gap{margin-top:18px}
.top-gap-small{margin-top:12px}

.count-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.count-button{height:46px;border:2px solid #476d67;border-radius:11px;color:#fff;background:#173936;font-weight:900}
.count-button.selected{color:#2c2109;border-color:#ffe08b;background:#e7c96e}

.room-number-box{text-align:center;padding:17px;border-radius:15px;background:linear-gradient(145deg,#d1a73d,#8b641d)}
.room-number{font-size:38px;font-weight:900;letter-spacing:8px}
.status,.turn-status{margin:16px 0;padding:11px;border-radius:11px;text-align:center;background:#153b37}
.lobby-player-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}
.lobby-player{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:#102c29}
.seat-badge{display:grid;width:38px;height:38px;place-items:center;border-radius:50%;color:#2c2109;background:#e7c96e;font-weight:900}
.empty-seat{opacity:.5}

.game-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.side-panel{display:grid;gap:15px;position:sticky;top:16px}
.info-card{padding:16px;border:1px solid rgba(239,211,132,.35);border-radius:16px;background:rgba(8,27,25,.92)}
.info-card h3{margin:0 0 12px;color:#f2d487}
.info-card p,.info-card li{line-height:1.6;color:#dce7e3}
.info-card details{margin-top:9px;padding:9px;border-radius:9px;background:#102c29}
.info-card summary{cursor:pointer;color:#f2d487;font-weight:900}

.game-topbar,.phase-panel{display:flex;justify-content:space-between;gap:12px;padding:14px;border-radius:14px;background:#12332f}
.phase-panel{margin-top:12px}
.game-small-label,.phase-panel small{display:block;color:#92aaa5;font-size:12px}
.game-room-number,.turn-number,.phase-panel strong{display:block;margin-top:4px;color:#f2d487;font-size:20px;font-weight:900}
.phase-player{text-align:right}
.resource-panel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.resource-item{text-align:center;padding:12px;border-radius:13px;background:linear-gradient(180deg,#dfbf63,#9b7424)}
.resource-item strong{display:block;font-size:28px}
.supply-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.supply-card{position:relative;min-height:138px;border:2px solid rgba(255,255,255,.12);border-radius:11px;padding:12px 7px;color:#201a0c;background:#e4c057}
.supply-card:disabled{opacity:.42}
.supply-card.action{color:#fff;background:linear-gradient(145deg,#547c92,#284c62)}
.supply-card.attack{color:#fff;background:linear-gradient(145deg,#b25147,#742b28)}
.supply-card.reaction{color:#fff;background:linear-gradient(145deg,#5895ba,#2f607d)}
.supply-card.victory{background:linear-gradient(145deg,#bad883,#739d50)}
.supply-card.treasure{background:linear-gradient(145deg,#f3d975,#bd8727)}
.supply-card.curse{color:#fff;background:linear-gradient(145deg,#735286,#3a2448)}
.supply-count{position:absolute;top:6px;right:6px;min-width:26px;border-radius:18px;padding:3px 6px;color:#fff;background:rgba(0,0,0,.65)}
.supply-name,.supply-cost,.supply-description{display:block;margin-top:10px;text-align:center}
.hand-cards,.played-cards{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;min-height:90px}
.text-card,.played-card{display:grid;width:100px;min-height:132px;place-items:center;padding:9px;border:3px solid #1c1c1c;border-radius:10px;text-align:center;font-weight:900}
.text-card.treasure,.played-card.treasure{background:#d3a53a}
.text-card.victory,.played-card.victory{background:#71984e}
.text-card.curse,.played-card.curse{color:#fff;background:#593b6b}
.text-card.action,.played-card.action{color:#fff;background:#31586d}
.text-card.attack,.played-card.attack{color:#fff;background:#993f38}
.text-card.reaction,.played-card.reaction{color:#fff;background:#3b7091}
.text-card.disabled-card{opacity:.65}
.card-description{margin-top:7px;font-size:12px}
.own-card-counts{display:flex;justify-content:center;gap:24px;padding:12px;border-radius:11px;background:#102c29}

.interaction-panel{margin:16px 0;padding:16px;border:2px solid #e6b45d;border-radius:14px;background:#4a351b}
.interaction-panel h3{margin:0 0 8px;color:#ffe09a}
.interaction-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice-card-grid,.supply-choice-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}
.choice-card,.supply-choice-card{position:relative;min-height:98px;border:3px solid transparent;border-radius:10px;padding:9px}
.choice-card.selected{border-color:#fff;box-shadow:0 0 0 3px #dfaa36}
.choice-card:disabled,.supply-choice-card:disabled{opacity:.35}
.game-player-list{display:grid;gap:8px}
.game-player-row{padding:10px;border-radius:10px;background:#102c29}
.game-player-row.active{outline:2px solid #e7c96e}
.game-player-row.finished{opacity:.62}
.empty-pile-status{padding:10px;border-radius:10px;background:#102c29;font-weight:900}
.empty-pile-status.warning{color:#ffd27a;background:#5d3a1d}
.game-log{max-height:300px;overflow:auto;padding:9px;border-radius:10px;background:#0d2522}
.log-row{padding:7px 3px;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.loading{position:fixed;z-index:200;inset:0;display:grid;place-items:center;background:rgba(4,16,15,.72)}
.loading-box{padding:20px 28px;border-radius:15px;color:#fff3ca;background:#173833}
.message{position:fixed;z-index:300;left:16px;right:16px;bottom:18px;max-width:520px;margin:auto;padding:13px;border-radius:12px;text-align:center;color:#fff;background:#345b56;transform:translateY(130px);opacity:0;transition:.25s}
.message.show{transform:translateY(0);opacity:1}
.message.error{background:#963f3f}
.result-ranking{display:grid;gap:8px}
.result-row{display:flex;justify-content:space-between;padding:10px;border-radius:10px;background:#102c29}

@media(max-width:1080px){
  .game-layout{grid-template-columns:1fr}
  .side-panel{position:static;grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
  .side-panel{grid-template-columns:1fr}
  .supply-cards{grid-template-columns:repeat(3,1fr)}
  .count-picker{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:500px){
  .button-grid{grid-template-columns:1fr}
  .lobby-player-grid{grid-template-columns:1fr}
  .supply-cards{grid-template-columns:repeat(2,1fr)}
  .choice-card-grid,.supply-choice-cards{grid-template-columns:repeat(2,1fr)}
}

.offline-text{display:block;margin-top:4px;color:#ffb0a8;font-weight:800}

.sync-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:10px;
  align-items:center
}
.sync-row .turn-status{
  margin:16px 0
}
.sync-status{
  min-width:78px;
  padding:8px 10px;
  border-radius:999px;
  text-align:center;
  color:#d8ebe6;
  background:#244c47;
  font-size:12px;
  font-weight:900
}
.sync-status.live{
  color:#193022;
  background:#8fd6a5
}
.sync-status.busy{
  color:#352508;
  background:#e7c96e
}
.sync-status.offline{
  color:#fff;
  background:#944747
}
@media(max-width:500px){
  .sync-row{
    grid-template-columns:1fr
  }
  .sync-status{
    justify-self:end;
    margin-top:-10px
  }
}

.winner-overlay{position:fixed;z-index:9999;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at center,rgba(239,201,91,.28),rgba(2,13,12,.93) 58%);backdrop-filter:blur(8px);animation:winnerFadeIn .35s ease-out}
.winner-card{position:relative;width:min(92vw,760px);padding:42px 28px 32px;overflow:hidden;border:3px solid #f3d373;border-radius:28px;text-align:center;background:linear-gradient(145deg,rgba(20,62,56,.98),rgba(5,27,25,.99));box-shadow:0 0 0 8px rgba(243,211,115,.08),0 26px 80px rgba(0,0,0,.58),0 0 45px rgba(243,211,115,.2);animation:winnerCardPop .5s cubic-bezier(.2,.9,.3,1.2)}
.winner-crown{font-size:72px;line-height:1;filter:drop-shadow(0 10px 16px rgba(0,0,0,.4));animation:winnerCrownFloat 1.8s ease-in-out infinite}
.winner-label{margin-top:14px;color:#dce9e5;font-size:clamp(16px,2.2vw,22px);font-weight:900;letter-spacing:4px}
.winner-big-name{margin-top:16px;padding:10px 12px;color:#ffe38a;font-size:clamp(46px,9vw,92px);font-weight:1000;line-height:1.05;word-break:break-word;text-shadow:0 5px 0 rgba(85,52,0,.55),0 0 26px rgba(255,219,100,.35)}
.winner-big-score{display:inline-block;margin-top:18px;padding:10px 22px;border-radius:999px;color:#2a2108;background:linear-gradient(180deg,#ffe796,#d6aa38);font-size:clamp(24px,4vw,38px);font-weight:1000;box-shadow:0 8px 18px rgba(0,0,0,.28)}
.winner-sub-message{margin-top:18px;color:#eef7f3;font-size:clamp(16px,2.4vw,23px);font-weight:800}
.winner-ranking-preview{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
.winner-ranking-chip{padding:8px 12px;border:1px solid rgba(255,255,255,.18);border-radius:999px;color:#dbe8e4;background:#103b36;font-size:14px;font-weight:800}
.winner-close-button{min-width:220px;margin-top:24px}
.winner-confetti{position:absolute;z-index:10000;color:#f7d66f;font-size:36px;pointer-events:none;animation:winnerConfetti 2.4s ease-in-out infinite}
.winner-confetti-a{top:10%;left:10%}.winner-confetti-b{top:18%;right:12%;animation-delay:.4s}.winner-confetti-c{bottom:16%;left:14%;animation-delay:.8s}.winner-confetti-d{bottom:12%;right:15%;animation-delay:1.2s}
@keyframes winnerFadeIn{from{opacity:0}to{opacity:1}}
@keyframes winnerCardPop{from{opacity:0;transform:scale(.72) translateY(24px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes winnerCrownFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes winnerConfetti{0%,100%{opacity:.45;transform:translateY(0) rotate(0deg) scale(.8)}50%{opacity:1;transform:translateY(-24px) rotate(180deg) scale(1.25)}}
@media(max-width:560px){.winner-card{padding:32px 18px 26px;border-radius:22px}.winner-crown{font-size:58px}.winner-big-name{font-size:clamp(38px,13vw,64px)}.winner-close-button{width:100%;min-width:0}}

.ai-lobby-controls{
  margin:16px 0;
  padding:14px;
  border:1px solid rgba(239,211,132,.32);
  border-radius:14px;
  background:#102c29
}
.ai-control-title{
  margin-bottom:10px;
  color:#f2d487;
  font-weight:900
}
.ai-difficulty-picker{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:10px
}
.ai-difficulty-button{
  min-height:42px;
  border:2px solid #476d67;
  border-radius:10px;
  color:#fff;
  background:#173936;
  font-weight:900
}
.ai-difficulty-button.selected{
  color:#2c2109;
  border-color:#ffe08b;
  background:#e7c96e
}
.ai-player-tag{
  display:inline-block;
  margin-left:7px;
  padding:2px 7px;
  border-radius:999px;
  color:#2c2109;
  background:#f1d173;
  font-size:11px;
  font-weight:900
}
.ai-remove-button{
  margin-left:auto;
  border:0;
  border-radius:8px;
  padding:6px 9px;
  color:#fff;
  background:#8b3d3d;
  font-weight:900
}
.game-player-row.ai-player{
  border-left:4px solid #e7c96e
}

.kingdom-mode-select{
  width:100%;
  min-height:50px;
  padding:0 12px;
  border:1px solid #55716d;
  border-radius:12px;
  color:#fff;
  background:#102e2b
}
.kingdom-mode-description{
  margin-top:9px;
  padding:10px;
  border-radius:10px;
  color:#cbded9;
  background:#102c29;
  line-height:1.5
}
.custom-kingdom-panel{
  margin-bottom:18px;
  padding:14px;
  border:1px solid rgba(239,211,132,.35);
  border-radius:14px;
  background:#102c29
}
.custom-kingdom-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:#f2d487
}
.custom-kingdom-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin:12px 0
}
.custom-kingdom-cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  max-height:380px;
  overflow:auto
}
.custom-card-option{
  min-height:78px;
  padding:9px;
  border:2px solid #456a65;
  border-radius:10px;
  color:#fff;
  text-align:left;
  background:#173936
}
.custom-card-option.selected{
  color:#2b2108;
  border-color:#ffe08b;
  background:#e7c96e
}
.custom-card-option strong,
.custom-card-option small{
  display:block
}
.custom-card-option small{
  margin-top:5px
}
.lobby-kingdom-summary{
  margin-top:14px;
  padding:12px;
  border-radius:12px;
  background:#102c29
}
.lobby-kingdom-summary strong{
  color:#f2d487
}
.lobby-kingdom-cards{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:9px
}
.kingdom-chip{
  padding:5px 8px;
  border-radius:999px;
  color:#dbe8e4;
  background:#24514b;
  font-size:12px;
  font-weight:800
}
@media(max-width:620px){
  .custom-kingdom-cards{
    grid-template-columns:repeat(2,1fr)
  }
}

.special-choice-cards{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin:14px 0
}
.special-revealed-card{
  min-width:120px;
  min-height:128px;
  padding:12px;
  border:3px solid rgba(255,255,255,.2);
  border-radius:12px;
  text-align:center;
  color:#fff;
  background:#294e49
}
.special-revealed-card.treasure{
  color:#2a2108;
  background:#d3a53a
}
.special-revealed-card.victory{
  color:#17220f;
  background:#71984e
}
.special-revealed-card.action{
  background:#31586d
}
.special-revealed-card.curse{
  background:#593b6b
}
.special-revealed-card strong,
.special-revealed-card small{
  display:block
}
.special-revealed-card small{
  margin-top:8px
}
.special-choice-buttons{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px
}
.special-choice-buttons .btn{
  width:100%
}
@media(max-width:520px){
  .special-choice-buttons{
    grid-template-columns:1fr
  }
}

.interaction-cancel-button{
  margin-top:10px
}

.deck-inspector-open-button{align-self:center}
.deck-inspector-overlay{position:fixed;z-index:9800;inset:0;display:grid;place-items:center;padding:18px;background:rgba(3,15,14,.9);backdrop-filter:blur(6px)}
.deck-inspector-panel{width:min(920px,96vw);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;border:2px solid rgba(239,211,132,.55);border-radius:22px;background:#0c2926;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.deck-inspector-header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:18px 20px 12px}
.deck-inspector-title{color:#f2d487;font-size:26px;font-weight:1000}
.deck-inspector-subtitle{margin-top:4px;color:#c9dbd6}
.deck-inspector-close{width:42px;height:42px;border:0;border-radius:999px;color:#fff;background:#31534f;font-size:28px;line-height:1}
.deck-inspector-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 20px 14px}
.deck-metric{padding:12px;border-radius:12px;text-align:center;background:#153d39}
.deck-metric small,.deck-metric strong{display:block}.deck-metric small{color:#bad0ca}.deck-metric strong{margin-top:4px;color:#ffe08b;font-size:26px}
.deck-inspector-controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,280px);gap:10px;padding:12px 20px;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}
.deck-inspector-tabs{display:flex;flex-wrap:wrap;gap:7px}
.deck-tab-button{padding:8px 12px;border:1px solid #50716b;border-radius:999px;color:#e8f2ef;background:#173b37;font-weight:800}
.deck-tab-button.selected{color:#2c2109;border-color:#ffe08b;background:#e7c96e}
.deck-inspector-search{width:100%;min-height:42px;padding:0 12px;border:1px solid #55716d;border-radius:10px;color:#fff;background:#102e2b}
.deck-inspector-list{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:16px 20px}
.deck-inspector-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:13px;border-left:5px solid rgba(255,255,255,.35);border-radius:12px;background:#153a36}
.deck-inspector-card.action{border-left-color:#70a8c2}.deck-inspector-card.treasure{border-left-color:#d4b451}.deck-inspector-card.victory{border-left-color:#79a85d}.deck-inspector-card.curse{border-left-color:#9368a7}
.deck-inspector-card-name{color:#fff;font-size:18px;font-weight:900}.deck-inspector-card-name span{margin-left:8px;color:#ffe08b}
.deck-inspector-card-description{margin-top:5px;color:#cbded9;font-size:13px;line-height:1.45}
.deck-inspector-card-meta{min-width:110px;text-align:right;color:#dce9e5;font-size:12px}.deck-inspector-card-meta span{display:block}.deck-cost{margin-bottom:7px;color:#ffe08b;font-weight:900}
.deck-inspector-empty{grid-column:1/-1;padding:32px;text-align:center;color:#cbded9}
.deck-inspector-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px 18px;border-top:1px solid rgba(255,255,255,.08);color:#bcd0cb}
@media(max-width:700px){.deck-inspector-metrics{grid-template-columns:repeat(2,1fr)}.deck-inspector-controls{grid-template-columns:1fr}.deck-inspector-list{grid-template-columns:1fr}}
@media(max-width:460px){.deck-inspector-overlay{padding:8px}.deck-inspector-panel{max-height:95vh;border-radius:16px}.deck-inspector-footer{align-items:stretch;flex-direction:column}}

.room-rule-panel{
  margin-bottom:18px;
  padding:14px;
  border:1px solid rgba(239,211,132,.35);
  border-radius:14px;
  background:#102c29
}
.room-rule-title{

.lobby-timer-summary{
